html/head_include="<meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no'><style>#hb-gate{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#090d18;color:#e8edf7;font-family:system-ui,-apple-system,sans-serif}#hb-gate h1{font-size:18px;font-weight:600;letter-spacing:2px;margin:0}#hb-gate input{padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid #2a3a55;background:#111a2b;color:#e8edf7;width:240px;text-align:center;outline:none}#hb-gate input:focus{border-color:#c87656}#hb-gate button{padding:12px 28px;font-size:16px;border-radius:10px;border:none;background:#c87656;color:#fff;cursor:pointer}#hb-gate .err{color:#ef6a6a;font-size:13px;height:16px}#hb-gate.hidden{display:none}</style><script>const HB_HASH='f8c6369dd7bd5e3b1127cc3564fd24ff72b08618e2140957f020bc41afaa5690';function hbHex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}async function hbTry(){var i=document.getElementById('hb-pass'),e=document.getElementById('hb-err');if(!window.crypto||!crypto.subtle){e.textContent='Unlock requires a secure (https) connection.';return}var h=hbHex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(i.value)));if(h===HB_HASH){document.getElementById('hb-gate').classList.add('hidden');document.getElementById('canvas').focus()}else{e.textContent='Incorrect password'}i.select()}document.addEventListener('DOMContentLoaded',function(){var g=document.createElement('div');g.id='hb-gate';var h=document.createElement('h1');h.textContent='HEALTH AVATAR';var inp=document.createElement('input');inp.id='hb-pass';inp.type='password';inp.placeholder='Password';inp.autocomplete='off';var btn=document.createElement('button');btn.id='hb-btn';btn.textContent='Unlock';var err=document.createElement('div');err.className='err';err.id='hb-err';g.appendChild(h);g.appendChild(inp);g.appendChild(btn);g.appendChild(err);document.body.appendChild(g);btn.addEventListener('click',hbTry);inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){hbTry()}});setTimeout(function(){inp.focus()},100)});</script>"
